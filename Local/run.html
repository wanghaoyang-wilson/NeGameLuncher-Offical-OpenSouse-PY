<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NE Launcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    width:831px;
    height:571px;
    background:#1e2430;
    color:#e4e7ed;
    font-family:system-ui;
    overflow:hidden;
}
.wrapper{
    display:flex;
    width:100%;
    height:100%;
}
.left-dark{
    width:260px;
    background:#12151c;
    padding:20px 20px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
}
/* 顶部椭圆胶囊按钮 */
.top-login-bar{
    width:100%;
    display:flex;
    gap:12px;
}
.login-btn{
    flex:1;
    padding:8px 0;
    border-radius:999px;
    border:none;
    position:relative;
    overflow:hidden;
    transition:transform 0.12s ease, background 0.12s ease;
}
.offline-btn{
    background:#2563eb;
    color:#fff;
}
.login-btn-disabled{
    background:#1a1f2b;
    color:#818896;
}
.login-btn:hover{
    transform:scale(1.03);
}
.login-btn:active{
    transform:scale(0.96);
}
/* 头像容器，支持点击光影 */
.avatar{
    width:96px;
    height:96px;
    border-radius:8px;
    background:#252c3a;
    margin-top:24px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
}
/* ID容器：文字与输入框完美重合对齐 */
.player-id-wrap{
    margin-top:12px;
    width:100%;
    text-align:center;
    position:relative;
    height:20px;
}
.player-id-text{
    font-size:14px;
    color:#94a3b8;
    line-height:20px;
}
.player-id-input{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:90%;
    height:20px;
    font-size:14px;
    line-height:20px;
    background:#1f2937;
    border:1px solid #3b4454;
    color:#e4e7ed;
    border-radius:4px;
    padding:0 6px;
    display:none;
    outline:none;
    text-align:center;
}
.spacer{
    flex:1;
    width:100%;
}
/* 底部按钮组 */
.bottom-action-group{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.launch-btn{
    width:100%;
    padding:18px 0;
    background:#1d4ed8;
    border:none;
    border-radius:8px;
    color:#fff;
    position:relative;
    overflow:hidden;
    transition:transform 0.12s ease, background 0.12s ease;
}
.launch-btn:hover{
    transform:scale(1.03);
}
.launch-btn:active{
    transform:scale(0.96);
}
.launch-title{
    font-size:22px;
    font-weight:bold;
    position:relative;
    z-index:2;
}
.launch-subtitle{
    font-size:13px;
    opacity:0.75;
    margin-top:4px;
    position:relative;
    z-index:2;
}
.vert-btn{
    width:100%;
    padding:12px 0;
    background:#1f2937;
    border:1px solid #374151;
    border-radius:6px;
    color:#e4e7ed;
    position:relative;
    overflow:hidden;
    transition:transform 0.12s ease, background 0.12s ease;
}
.vert-btn:hover{
    transform:scale(1.03);
}
.vert-btn:active{
    transform:scale(0.96);
}
.right-light{
    flex:1;
    padding:30px;
    background:#1e2430;
}
*{
    cursor: auto !important;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="left-dark">
        <div class="top-login-bar">
            <button class="login-btn offline-btn" id="btnOffline">离线</button>
            <button class="login-btn login-btn-disabled" id="btnLogin">登录</button>
        </div>

        <div class="avatar" id="avatarBox"></div>

        <div class="player-id-wrap" id="idWrap">
            <div class="player-id-text" id="idText">Player_ID_001</div>
            <input type="text" class="player-id-input" id="idInput" maxlength="24">
        </div>

        <div class="spacer"></div>

        <div class="bottom-action-group">
            <button class="launch-btn" id="btnLaunch">
                <div class="launch-title">启动游戏</div>
                <div class="launch-subtitle" id="subTitle">副标题预留（对接API）</div>
            </button>
            <button class="vert-btn" id="btnVersion">选择版本</button>
            <button class="vert-btn" id="btnSetting">游戏设置</button>
        </div>
    </div>

    <div class="right-light">
    </div>
</div>

<script>
const BASE_DURATION = 400;

// 通用波纹生成函数，支持自定义透明度（头像用浅色）
function createRipple(target, e, opacity = 0.22, glowOpacity = 0.35) {
    const rect = target.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const width = target.offsetWidth;
    let dur = BASE_DURATION;
    if(width < 200) dur = BASE_DURATION * 0.75;

    // 水波纹
    const ripple = document.createElement('span');
    ripple.style.cssText = `
        position:absolute;left:${x}px;top:${y}px;width:0;height:0;
        background:rgba(255,255,255,${opacity});border-radius:50%;
        transform:translate(-50%,-50%);transition:width ${dur}ms ease-out,height ${dur}ms ease-out,opacity ${dur}ms ease-out;
        z-index:999;opacity:1;
    `;
    target.appendChild(ripple);

    // 漫射柔光
    const glow = document.createElement('span');
    glow.style.cssText = `
        position:absolute;left:${x}px;top:${y}px;width:0;height:0;
        background:radial-gradient(circle, rgba(120,170,255,${glowOpacity}) 0%, transparent 70%);
        border-radius:50%;transform:translate(-50%,-50%);
        transition:width ${dur}ms ease-out,height ${dur}ms ease-out,opacity ${dur}ms ease-out;
        z-index:998;opacity:1;
    `;
    target.appendChild(glow);

    requestAnimationFrame(()=>{
        ripple.style.width = '320px';
        ripple.style.height = '320px';
        ripple.style.opacity = '0';
        glow.style.width = '420px';
        glow.style.height = '420px';
        glow.style.opacity = '0';
    });
    setTimeout(()=>{
        ripple.remove();
        glow.remove();
    }, dur);
}

// 按钮元素获取
const btnLaunch = document.getElementById('btnLaunch');
const btnVersion = document.getElementById('btnVersion');
const btnSetting = document.getElementById('btnSetting');
const btnOffline = document.getElementById('btnOffline');
const btnLogin = document.getElementById('btnLogin');
const avatar = document.getElementById('avatarBox');

// 启动游戏
btnLaunch.addEventListener('mousedown', e=>{
    createRipple(btnLaunch,e);
    if(window.qtWebChannel) qtWebChannel.onLaunchGame();
    else console.log('QT_EVENT:onLaunchGame');
})
// 选择版本
btnVersion.addEventListener('mousedown', e=>{
    createRipple(btnVersion,e);
    if(window.qtWebChannel) qtWebChannel.onSelectVersion();
    else console.log('QT_EVENT:onSelectVersion');
})
// 游戏设置
btnSetting.addEventListener('mousedown', e=>{
    createRipple(btnSetting,e);
    if(window.qtWebChannel) qtWebChannel.onOpenSetting();
    else console.log('QT_EVENT:onOpenSetting');
})
// 离线按钮
btnOffline.addEventListener('mousedown', e=>{
    createRipple(btnOffline,e);
    if(window.qtWebChannel) qtWebChannel.onOfflineMode();
    else console.log('QT_EVENT:onOfflineMode');
})
// 登录按钮
btnLogin.addEventListener('mousedown', e=>{
    createRipple(btnLogin,e);
    if(btnLogin.classList.contains('login-btn-disabled')){
        e.preventDefault();
        e.stopPropagation();
        return;
    }
    if(window.qtWebChannel) qtWebChannel.onLoginClick();
    else console.log('QT_EVENT:onLoginClick');
})

// 头像左键点击事件
avatar.addEventListener('mousedown', e => {
    createRipple(avatar, e, 0.12, 0.18);
    if(e.button === 0){
        if(window.qtWebChannel) qtWebChannel.onAvatarLeftClick();
        else console.log('QT_EVENT:onAvatarLeftClick');
    }
})
// 头像右键菜单
avatar.addEventListener('contextmenu', e => {
    e.preventDefault();
    createRipple(avatar, e, 0.12, 0.18);
    if(window.qtWebChannel) qtWebChannel.onAvatarRightClick();
    else console.log('QT_EVENT:onAvatarRightClick');
})

// ID双击编辑逻辑
const idWrap = document.getElementById('idWrap');
const idText = document.getElementById('idText');
const idInput = document.getElementById('idInput');
let editMode = false;

idWrap.addEventListener('dblclick', ()=>{
    if(editMode) return;
    editMode = true;
    idText.style.display = 'none';
    idInput.style.display = 'block';
    idInput.value = idText.innerText;
    idInput.focus();
    requestAnimationFrame(()=> idInput.select());
})

function submitNickname(){
    if(!editMode) return;
    const val = idInput.value.trim();
    idText.innerText = val || idText.innerText;
    idInput.style.display = 'none';
    idText.style.display = 'block';
    editMode = false;
    if(window.qtWebChannel) qtWebChannel.onNicknameChanged(val);
    else console.log('QT_EVENT:onNicknameChanged ->', val);
}
idInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter') submitNickname();
    if(e.key === 'Escape'){
        idInput.value = idText.innerText;
        submitNickname();
    }
})
idInput.addEventListener('blur', submitNickname);

// ====================== 完整双向 WebChannel API ======================
window.qtWebChannel = {
    // ========= JS → QT（页面点击事件回调） =========
    onLaunchGame(){},         // 启动游戏按钮
    onSelectVersion(){},      // 选择版本按钮
    onOpenSetting(){},        // 游戏设置按钮
    onOfflineMode(){},        // 离线模式按钮
    onLoginClick(){},         // 登录按钮
    onAvatarLeftClick(){},    // 头像左键单击
    onAvatarRightClick(){},   // 头像右键菜单
    onNicknameChanged(name){},// 修改昵称提交

    // ========= QT → JS（前端状态控制接口） =========
    setPlayerName(name){
        idText.innerText = name;
    },
    setSubTitle(text){
        document.getElementById('subTitle').innerText = text;
    },
    setLoginState(enableLogin){
        if(enableLogin){
            btnLogin.classList.remove('login-btn-disabled');
        }else{
            btnLogin.classList.add('login-btn-disabled');
        }
    }
}
</script>
</body>
</html>
